name: Deploy xuxiao-api

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target (main only)
        type: choice
        options: [mianjing, shared]
        default: mianjing

permissions:
  contents: read

concurrency:
  group: deploy-xuxiao-api-production
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  DEPLOY_PATH: /www/wwwroot/xuxiao-api
  PM2_APP_NAME: xuxiao-api
  HEALTHCHECK_URL: http://127.0.0.1:3000/api/health

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.target.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: target
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          MANUAL_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            value=check
          elif [ "$EVENT" = workflow_dispatch ]; then
            value="$MANUAL_TARGET"
          else
            value=$(python3 deploy/mianjing/classify.py "$BEFORE" "$AFTER")
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"
  build:
    name: Build and type-check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xuxiao_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xuxiao_api_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup pnpm
        run: npm install --global pnpm@10.13.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/xuxiao_api?schema=public

      - name: Run unit tests
        run: pnpm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/xuxiao_api_test?schema=public
          OSS_REGION: oss-cn-beijing
          OSS_BUCKET: test-bucket
          OSS_ENDPOINT: https://oss-cn-beijing.aliyuncs.com
          OSS_PUBLIC_BASE_URL: https://test-bucket.oss-cn-beijing.aliyuncs.com
          OSS_ACCESS_KEY_ID: test-access-key-id
          OSS_ACCESS_KEY_SECRET: test-access-key-secret

      - name: Build
        run: pnpm build

      - name: Deployment safety tests
        run: python3 -m unittest discover -s deploy/mianjing -v

      - name: Create isolated mianjing test database
        env:
          PGPASSWORD: postgres
        run: createdb -h localhost -U postgres mianjing_api_test

      - name: Mianjing API integration tests
        run: pnpm exec vitest run tests/mianjing.api.test.ts
        env:
          MIANJING_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mianjing_api_test

      - name: Verify database migration safety
        run: pnpm test:integration
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/xuxiao_api_test

      - name: Package exact backend build
        if: matrix.node == '24' && github.event_name != 'pull_request'
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          mkdir -p .release
          printf '{"commit":"%s"}\n' "$RELEASE_SHA" > release.json
          tar --exclude='__pycache__' -czf .release/app.tgz dist package.json pnpm-lock.yaml prisma prisma.config.ts deploy/mianjing release.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: matrix.node == '24' && github.event_name != 'pull_request'
        with:
          name: backend-${{ github.sha }}
          path: .release/app.tgz
          retention-days: 7

  deploy:
    name: Deploy to Tencent Cloud server
    runs-on: ubuntu-latest
    needs: [build, classify]
    if: github.ref == 'refs/heads/main' && needs.classify.outputs.target == 'shared'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.TENCENT_SERVER_SSH_KEY }}" > ~/.ssh/tencent_server_key
          chmod 600 ~/.ssh/tencent_server_key
          ssh-keyscan -p "${{ secrets.TENCENT_SERVER_PORT }}" "${{ secrets.TENCENT_SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload source to server
        run: |
          set -euo pipefail
          tar \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='.pnpm-store' \
            -czf /tmp/xuxiao-api-source.tgz .

          scp -i ~/.ssh/tencent_server_key \
            -P "${{ secrets.TENCENT_SERVER_PORT }}" \
            /tmp/xuxiao-api-source.tgz \
            "${{ secrets.TENCENT_SERVER_USER }}@${{ secrets.TENCENT_SERVER_HOST }}:/tmp/xuxiao-api-source.tgz"

          ssh -i ~/.ssh/tencent_server_key \
            -p "${{ secrets.TENCENT_SERVER_PORT }}" \
            "${{ secrets.TENCENT_SERVER_USER }}@${{ secrets.TENCENT_SERVER_HOST }}" \
            "DEPLOY_PATH='${DEPLOY_PATH}' bash -s" <<'EOF'
          set -euo pipefail

          mkdir -p "$DEPLOY_PATH"

          if [ ! -f "$DEPLOY_PATH/.env" ]; then
            echo "Missing production .env in $DEPLOY_PATH" >&2
            exit 1
          fi

          find "$DEPLOY_PATH" \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name '.env' \
            ! -name 'node_modules' \
            ! -name 'dist' \
            -exec rm -rf {} +

          tar -xzf /tmp/xuxiao-api-source.tgz -C "$DEPLOY_PATH"
          rm -f /tmp/xuxiao-api-source.tgz
          EOF

      - name: Deploy application
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/tencent_server_key \
            -p "${{ secrets.TENCENT_SERVER_PORT }}" \
            "${{ secrets.TENCENT_SERVER_USER }}@${{ secrets.TENCENT_SERVER_HOST }}" \
            "DEPLOY_PATH='${DEPLOY_PATH}' PM2_APP_NAME='${PM2_APP_NAME}' HEALTHCHECK_URL='${HEALTHCHECK_URL}' bash -s" <<'EOF'
          set -euo pipefail

          cd "$DEPLOY_PATH"
          export CI=true
          export NPM_CONFIG_REGISTRY=https://registry.npmmirror.com/
          export PNPM_CONFIG_REGISTRY=https://registry.npmmirror.com/
          export PNPM_CONFIG_TRUST_LOCKFILE=true
          export PNPM_CONFIG_CONFIRM_MODULES_PURGE=false

          if [ ! -f .env ]; then
            echo "Missing production .env in $DEPLOY_PATH" >&2
            exit 1
          fi

          if ! command -v pnpm >/dev/null 2>&1; then
            if command -v corepack >/dev/null 2>&1; then
              corepack enable
            fi
          fi

          if ! command -v pnpm >/dev/null 2>&1; then
            echo "pnpm is not installed on the server. Install pnpm once before deploying." >&2
            exit 1
          fi

          pnpm --version
          pnpm config get registry
          pnpm install --frozen-lockfile --force --config.registry=https://registry.npmmirror.com/ --config.confirmModulesPurge=false
          pnpm prisma:generate

          rm -rf dist
          pnpm build
          pnpm exec prisma migrate deploy

          if pm2 describe "$PM2_APP_NAME" >/dev/null 2>&1; then
            pm2 restart "$PM2_APP_NAME" --update-env
          else
            pm2 start dist/main.js --name "$PM2_APP_NAME" --update-env
          fi

          pm2 save
          for attempt in $(seq 1 30); do
            if curl -fsS "$HEALTHCHECK_URL"; then
              exit 0
            fi

            echo "Waiting for $PM2_APP_NAME healthcheck ($attempt/30)..."
            sleep 2
          done

          echo "Healthcheck failed after waiting. PM2 status:"
          pm2 describe "$PM2_APP_NAME" || true

          echo "Recent PM2 logs:"
          pm2 logs "$PM2_APP_NAME" --lines 100 --nostream || true

          exit 1
          EOF

  deploy-mianjing:
    name: Deploy isolated mianjing API
    needs: [build, classify]
    if: github.ref == 'refs/heads/main' && needs.classify.outputs.target == 'mianjing'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: backend-${{ github.sha }}
          path: .release/
      - name: Upload and activate isolated API
        env:
          DEPLOY_HOST: ${{ secrets.TENCENT_SERVER_HOST }}
          DEPLOY_PORT: ${{ secrets.TENCENT_SERVER_PORT }}
          DEPLOY_USER: ${{ secrets.TENCENT_SERVER_USER }}
          DEPLOY_KEY: ${{ secrets.TENCENT_SERVER_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.TENCENT_SERVER_KNOWN_HOSTS }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          test -n "$DEPLOY_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          key="$RUNNER_TEMP/mianjing-api-key"
          hosts="$RUNNER_TEMP/mianjing-api-hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$hosts"
          ssh_args=(-i "$key" -p "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$hosts")
          latest=$(gh api repos/xuxiao01/xuxiao-api/git/ref/heads/main --jq .object.sha)
          test "$latest" = "$RELEASE_SHA"
          upload="$RELEASE_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          remote="/www/wwwroot/mianjing-api/incoming/$upload"
          target="$DEPLOY_USER@$DEPLOY_HOST"
          ssh "${ssh_args[@]}" "$target" "mkdir -p '$remote'"
          scp -i "$key" -P "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$hosts" .release/app.tgz deploy/mianjing/deploy.py "$target:$remote/"
          digest=$(sha256sum .release/app.tgz | cut -d ' ' -f 1)
          ssh "${ssh_args[@]}" "$target" "python3 '$remote/deploy.py' '$RELEASE_SHA' '$upload' '$digest'"
      - name: Record deployment
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: echo "Published mianjing API $RELEASE_SHA at https://xuxiaoapi.online/api/mianjing/health" >> "$GITHUB_STEP_SUMMARY"
